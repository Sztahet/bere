<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#16151a">
  <meta name="description" content="Opowiadania Saily, Adriena, Leny, Lucena i Tarena w jednym archiwum.">
  <title>Archiwum Riftoryn</title>
  <link rel="stylesheet" href="riftoryn-unity/Web/story-archive.css">
  <script defer src="riftoryn-unity/Web/story-archive-data.js"></script>
  <script defer src="riftoryn-unity/Web/story-archive.js"></script>
</head>
<body>
  <header class="masthead">
    <div class="shell masthead-inner">
      <a class="wordmark" href="archiwum-riftoryn.html">Riftoryn</a>
      <a class="codex-link" href="riftoryn-menu.html">Kodeks <span aria-hidden="true">↗</span></a>
    </div>
  </header>
  <main class="shell" id="archive">
    <div class="collection-heading">
      <h1>Archiwum Riftoryn</h1>
      <p>Wybierz bohatera i rozpocznij lekturę.</p>
    </div>
    <nav class="hero-list" id="heroes" aria-label="Bohaterowie"></nav>
    <section class="collection" id="collection" aria-labelledby="collection-title"></section>
    <noscript><p>Włącz JavaScript, aby otworzyć katalog i czytnik.</p></noscript>
  </main>
  <main class="shell reader" id="reader" hidden>
    <div class="reader-bar">
      <a id="back-to-collection" href="archiwum-riftoryn.html">← Wróć do opowiadań</a>
      <span id="reader-series"></span>
    </div>
    <header class="reader-heading">
      <p class="reader-meta" id="reader-meta"></p>
      <h1 id="story-title" tabindex="-1"></h1>
    </header>
    <div class="reader-layout">
      <aside>
        <nav id="chapters" aria-label="Spis treści"></nav>
      </aside>
      <article id="story" aria-labelledby="story-title"></article>
    </div>
    <nav class="reader-end" id="story-navigation" aria-label="Inne opowiadania"></nav>
  </main>
</body>
</html>
